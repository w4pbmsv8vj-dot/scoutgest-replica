<title>ScoutGest Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#f5f7fa;--surface:#ffffff;--surface-2:#eef2f7;
    --fg:#152238;--muted:#5a6a82;
    --pitch:#1a5cb0;--pitch-deep:#10294d;--gold:#c7920e;
    --line:#d9dfe8;--good:#2e7d43;--warn:#b07708;--bad:#b3402f;
    --shadow:0 1px 2px rgba(21,34,56,.05),0 6px 20px rgba(21,34,56,.06);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c1220;--surface:#141d30;--surface-2:#1b2740;--fg:#e8edf6;--muted:#94a2ba;
    --pitch:#5b8fd9;--pitch-deep:#0a1424;--gold:#e0b64f;--line:#283650;
    --good:#5cbb77;--warn:#d9a53f;--bad:#e07a67;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:#0c1220;--surface:#141d30;--surface-2:#1b2740;--fg:#e8edf6;--muted:#94a2ba;
    --pitch:#5b8fd9;--pitch-deep:#0a1424;--gold:#e0b64f;--line:#283650;
    --good:#5cbb77;--warn:#d9a53f;--bad:#e07a67;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:'Inter',system-ui,sans-serif;font-size:14.5px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Archivo',sans-serif;text-wrap:balance;margin:0}
  button{font:inherit;cursor:pointer}
  a{color:var(--pitch);text-decoration:none}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--pitch);outline-offset:2px;border-radius:4px}
  input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--pitch);outline:none}
  label.fl{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:5px}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
  .sidebar{
    background:var(--pitch-deep);color:#c7d4ea;padding:14px 10px;
    position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
  }
  .brand{
    font-family:'Archivo',sans-serif;font-weight:900;font-style:italic;font-size:19px;
    text-transform:uppercase;letter-spacing:.4px;color:#fff;padding:6px 10px 16px;display:block;
  }
  .brand .star{color:var(--gold);font-style:normal;font-size:12px;vertical-align:6px}
  .brand em{color:#8fb8e8;font-style:inherit}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
    color:#c7d4ea;font-size:13.5px;font-weight:600;text-decoration:none;border:0;background:none;width:100%;text-align:left;
  }
  .nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item.active{background:rgba(255,255,255,.14);color:#fff}
  .nav-sep{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7188ab;padding:14px 10px 4px}
  .content{min-width:0;padding:0 max(18px,env(safe-area-inset-right,0px)) 60px max(18px,env(safe-area-inset-left,0px))}
  header.top{
    position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    margin:0 calc(-1 * max(18px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(18px,env(safe-area-inset-left,0px)));
    padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .gsearch{flex:1 1 200px;min-width:0;position:relative;max-width:420px}
  .gsearch input{padding:8px 12px 8px 34px;background:var(--surface-2)}
  .gsearch svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
  .gs-results{
    position:absolute;top:42px;left:0;right:0;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);z-index:50;max-height:320px;overflow-y:auto;
  }
  .gs-results a{display:block;padding:9px 14px;color:var(--fg);font-size:13.5px;border-bottom:1px solid var(--line)}
  .gs-results a:last-child{border:0}
  .gs-results a:hover{background:var(--surface-2)}
  .gs-results b{display:block}
  .gs-results small{color:var(--muted)}
  .btn{
    background:var(--pitch);color:#fff;border:0;border-radius:9px;padding:8px 16px;font-weight:700;font-size:13.5px;
  }
  .btn:hover{background:var(--pitch-deep)}
  .btn.ghost{background:var(--surface-2);color:var(--fg)}
  .btn.gold{background:var(--gold);color:#fff}
  .btn.sm{padding:5px 11px;font-size:12.5px}
  .btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);position:relative}
  .iconbtn:hover{border-color:var(--pitch);color:var(--pitch)}
  .iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
  .notif-panel{position:absolute;right:0;top:44px;width:320px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:50}
  .notif-panel .ni{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .notif-panel .ni:last-child{border:0}
  .notif-panel .ni b{display:block;font-size:13px}
  .notif-panel .ni.unread{background:color-mix(in srgb,var(--pitch) 6%,transparent)}
  .notif-panel .ni small{color:var(--muted)}
  .menu-pop{position:absolute;right:0;top:44px;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:50;padding:6px}
  .menu-pop a{display:block;padding:8px 12px;border-radius:8px;color:var(--fg);font-weight:600;font-size:13.5px}
  .menu-pop a:hover{background:var(--surface-2)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:228px;z-index:60;transform:translateX(-100%);transition:transform .2s ease}
    .sidebar.open{transform:none}
    .burger{display:grid!important}
    .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  }
  .burger{display:none}

  /* ---------- common ---------- */
  .view{animation:fade .2s ease;max-width:1160px}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--pitch);display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .kicker::before{content:"";width:20px;height:2px;background:var(--gold)}
  .view h1{font-size:clamp(21px,3.5vw,28px);font-weight:800}
  .lede{color:var(--muted);margin:5px 0 0;max-width:60ch}
  .pagehead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
  .card .hd h2{font-size:14.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .card .hd .sp{margin-left:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
  .frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;padding:14px 16px}
  .tbl-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
  td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr.rowlink{cursor:pointer}
  tbody tr.rowlink:hover td{background:color-mix(in srgb,var(--pitch) 5%,transparent)}
  td.nw{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.03em}
  .tag.blue{background:color-mix(in srgb,var(--pitch) 13%,transparent);color:var(--pitch)}
  .tag.gold{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
  .tag.green{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
  .tag.red{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
  .score-pill{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:8px;padding:0 7px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums;background:var(--surface-2)}
  .score-pill.hi{background:color-mix(in srgb,var(--good) 17%,transparent);color:var(--good)}
  .score-pill.mid{background:color-mix(in srgb,var(--gold) 17%,transparent);color:var(--gold)}
  .score-pill.lo{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
  .empty{padding:30px 16px;text-align:center;color:var(--muted)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--pitch-deep);color:#fff;border-radius:10px;padding:11px 20px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);z-index:90}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .kpi .card{padding:14px 16px}
  .kpi b{font-family:'Archivo',sans-serif;font-size:26px;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
  .seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--pitch);color:#fff}
  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
  .filters input,.filters select{width:auto;flex:1 1 130px;min-width:0;font-size:13px;padding:7px 10px}
  /* tabs */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tabs button{border:0;background:none;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--pitch);border-bottom-color:var(--gold)}
  /* kanban */
  .kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
  @media (max-width:900px){.kanban{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.kanban{grid-template-columns:1fr}}
  .kcol{background:var(--surface-2);border-radius:12px;padding:10px}
  .kcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:2px 4px 10px;display:flex;justify-content:space-between}
  .kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .kcard b{display:block;font-size:13.5px;cursor:pointer}
  .kcard b:hover{color:var(--pitch)}
  .kcard .km{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kcard .kv{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .kcard .mv{display:flex;gap:4px;margin-top:8px}
  .kcard .mv button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:11px;padding:2px 7px;font-weight:700;color:var(--muted)}
  .kcard .mv button:hover{border-color:var(--pitch);color:var(--pitch)}
  /* player profile */
  .phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px}
  .phead .photo{width:64px;height:64px;border-radius:14px;background:linear-gradient(140deg,var(--pitch-deep),#1d4a8f);color:#fff;display:grid;place-items:center;font-family:'Archivo',sans-serif;font-weight:900;font-size:22px}
  .phead .pmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .radar-wrap{display:grid;place-items:center;padding:10px}
  .timeline{list-style:none;margin:0;padding:4px 18px 16px}
  .timeline li{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
  .timeline li:last-child{border:0}
  .timeline .tdate{min-width:86px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600}
  .ob-row{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .ob-row:hover{background:color-mix(in srgb,var(--pitch) 4%,transparent)}
  .ob-row:last-child{border:0}
  .ob-row .obh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ob-row .obn{font-size:13px;color:var(--muted);margin-top:4px;max-width:72ch}
  .param-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px dashed var(--line)}
  .param-row:last-child{border:0}
  .param-row>span{flex:1;font-size:13.5px;font-weight:600}
  .param-row .scale{display:flex;gap:4px}
  .param-row .scale button{width:30px;height:26px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:11.5px;font-weight:700;color:var(--muted);padding:0}
  .param-row .scale button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .barrow span{width:120px;font-size:12.5px;color:var(--muted);font-weight:600}
  .barrow .bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .barrow .bar i{display:block;height:100%;background:var(--pitch);border-radius:99px}
  .hbar{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 16px}
  .hbar .hb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .hbar .hb i{display:block;width:70%;background:var(--pitch);border-radius:6px 6px 0 0;min-height:3px}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:30px 16px;background:linear-gradient(140deg,var(--pitch-deep),#1c4585)}
  .login-card{width:min(400px,100%);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:32px 28px}
  .login-card .brand{color:var(--fg);text-align:center;font-size:26px;padding-bottom:4px}
  .login-card .brand em{color:var(--pitch)}
  .login-card p{text-align:center;color:var(--muted);margin:0 0 20px;font-size:13px}
  .role-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .role-pick button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 8px;font-weight:700;font-size:12.5px;color:var(--muted)}
  .role-pick button.on{border-color:var(--pitch);color:var(--pitch);background:color-mix(in srgb,var(--pitch) 7%,transparent)}
  /* fase 2: calendario, confronto, commenti */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .calh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;padding:4px 0}
  .cal .day{min-height:78px;background:var(--surface-2);border-radius:8px;padding:5px 6px;font-size:11px;font-variant-numeric:tabular-nums}
  .cal .day.out{opacity:.35}
  .cal .day.today{box-shadow:inset 0 0 0 2px var(--gold)}
  .cal .ev{display:block;margin-top:3px;background:var(--pitch);color:#fff;border-radius:5px;padding:2px 5px;font-size:10px;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal .ev.done{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
  .calnav{display:flex;align-items:center;gap:10px}
  .cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .cmp-card{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
  .cmp-card b{display:block;font-size:14px}
  .cmp-card small{color:var(--muted)}
  .cmpradio td:first-child{width:26px}
  .cmpradio input{width:auto}
  .cmt{padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  .cmt:last-child{border:0}
  .cmt b{font-size:12.5px}
  .cmt small{color:var(--muted)}
  .cmt p{margin:4px 0 0}
  .tagbar{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
  .tagbar .tag{cursor:pointer;font-size:12px;padding:4px 12px}
  .tagbar .tag.on{background:var(--pitch);color:#fff}
  /* fase 3: AI, video, mercato */
  .ai-panel{background:linear-gradient(140deg,var(--pitch-deep),#1c4585);color:#e8edf6;border-radius:12px;padding:16px 18px;margin-top:14px}
  .ai-panel h3{color:var(--gold);font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .ai-panel h3::before{content:"✦";color:var(--gold)}
  .ai-panel .ai-body{font-size:13.5px;line-height:1.6}
  .ai-panel .ai-body b{color:#fff}
  .ai-panel ul{margin:8px 0 0;padding-left:18px}
  .ai-panel li{margin:4px 0}
  .ai-panel .ai-note{margin-top:10px;font-size:11.5px;color:#9fb4d6;font-style:italic}
  .ai-q{display:flex;gap:8px;margin-top:12px}
  .ai-q input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
  .ai-q input::placeholder{color:#9fb4d6}
  .clip-row{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
  .clip-row:hover{background:color-mix(in srgb,var(--pitch) 4%,transparent)}
  .clip-row .thumb{width:74px;height:44px;border-radius:8px;background:linear-gradient(140deg,var(--pitch-deep),#1d4a8f);display:grid;place-items:center;flex:0 0 auto}
  .clip-row .thumb svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
  .clip-row .ci{flex:1;min-width:150px}
  .clip-row .ci b{display:block;font-size:13.5px}
  .clip-row .ci small{color:var(--muted)}
  .clip-row .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .mkt-pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  @media (max-width:960px){.mkt-pipe{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){.mkt-pipe{grid-template-columns:1fr 1fr}}
  .mkt-col h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 2px 8px;display:flex;justify-content:space-between}
  .mkt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
  .mkt-card:hover{border-color:var(--gold)}
  .mkt-card b{display:block;font-size:13px}
  .mkt-card small{color:var(--muted);font-size:11.5px;display:block}
  .mkt-card .mc{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
</style>
</head><body>

<!-- ============ LOGIN ============ -->

/* ================= STATE & HELPERS ================= */
var ME=dbGet('me',{nome:'Marco Lazzeri',role:'admin',scoutId:1});
var canEdit=function(){return ME.role!=='viewer'};
var ROLE_LABEL={admin:'Admin',head:'Head of Scouting',scout:'Scout',viewer:'Viewer'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function fmtD(iso){if(!iso)return '—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function age(iso){if(!iso)return '—';var b=new Date(iso),n=new Date();var a=n.getFullYear()-b.getFullYear();var m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a}
function initials(nome,cognome){return ((nome||'?')[0]+(cognome||'?')[0]).toUpperCase()}
function playerScore(p){
  var obs=dbGet('observations',[]).filter(function(o){return o.player===p.id&&o.sc});
  if(!obs.length)return null;
  var s=0,n=0;['tecnica','tattica','fisico','mentalita'].forEach(function(k){
    obs.forEach(function(o){if(o.sc[k]){s+=o.sc[k];n++}});
  });
  return n?+(s/n).toFixed(1):null;
}
function scoreClass(v){return v>=8?'hi':v>=6.5?'mid':v?'lo':''}
function roleTag(r){return {Portiere:'gold',Difensore:'blue',Centrocampista:'',Attaccante:'red'}[r]||''}
function notify(testo,tipo){var a=dbGet('activity',[]);a.unshift({quando:'Adesso',testo:testo,tipo:tipo||'Sistema'});dbSet('activity',a.slice(0,30))}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function dstr(off){var d=new Date(Date.now()+(off||0)*864e5);return d.toISOString().slice(0,10)}

/* ================= RENDER SHELL ================= */
function renderShell(){
  var n=nav();
  document.querySelectorAll('.nav-item').forEach(function(a){
    var v=a.getAttribute('data-nav');
    a.classList.toggle('active',v===n.view||(v==='giocatori'&&n.view==='player')||(v==='giocatori'&&n.view==='giocatori-new')||(v==='osservazioni'&&n.view==='osservazioni-new')||(v==='report'&&n.view==='report-new')||(v==='partite'&&n.view==='partite-new'));
  });
  var av=document.getElementById('userAv');
  av.textContent=initials(ME.nome.split(' ')[0],ME.nome.split(' ')[1]||'');
  av.title=ME.nome+' — '+ROLE_LABEL[ME.role];
  renderNotifs();
}
function renderNotifs(){
  var acts=dbGet('activity',[]).slice(0,6);
  var p=document.getElementById('notifPanel');
  p.innerHTML=acts.map(function(a){return '<div class="ni unread"><b>'+esc(a.tipo)+'</b>'+esc(a.testo)+'<br><small>'+esc(a.quando)+'</small></div>'}).join('');
  document.getElementById('notifDot').hidden=acts.length===0;
}

/* ================= VIEWS ================= */
function pagehead(kicker,title,actionsHtml,lede){
  return '<div class="pagehead"><div><p class="kicker">'+kicker+'</p><h1>'+title+'</h1>'+(lede?'<p class="lede">'+lede+'</p>':'')+'</div><div class="actions">'+(actionsHtml||'')+'</div></div>';
}
function tbl(head,rows){
  if(!rows.length)return '<div class="empty">Nessun dato — prova a modificare i filtri.</div>';
  return '<div class="tbl-wrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
}

function radarSVG(A){
  var axes=[['tecnica','Tecnica'],['tattica','Tattica'],['fisico','Fisico'],['mentalita','Mentalità']];
  var cx=110,cy=100,R=70,n=axes.length;
  var pts=axes.map(function(ax,i){
    var ang=-Math.PI/2+i*2*Math.PI/n,v=A[ax[0]]||0,r=R*v/10;
    return {x:cx+r*Math.cos(ang),y:cy+r*Math.sin(ang),lx:cx+(R+16)*Math.cos(ang),ly:cy+(R+16)*Math.sin(ang),v:v,l:ax[1]};
  });
  var poly=pts.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ');
  var rings=[0.25,0.5,0.75,1].map(function(f){
    var rp=axes.map(function(ax,i){var ang=-Math.PI/2+i*2*Math.PI/n;return (cx+R*f*Math.cos(ang)).toFixed(1)+','+(cy+R*f*Math.sin(ang)).toFixed(1)}).join(' ');
    return '<polygon points="'+rp+'" fill="none" stroke="var(--line)" stroke-width="1"/>';
  }).join('');

function bindObsNew(){

      short:document.getElementById('obShort').checked};

      var SL=dbGet('shortlist',[]);
      if(!SL.find(function(s){return s.player===o.player}))SL.push({id:Date.now(),player:o.player,stato:'Segnalato',priorita:c.priorita,nota:''});
      dbSet('shortlist',SL);
    }

  });
}

/* ---------- SQUADRE ---------- */
function vSquadre(){
  var P=dbGet('players',[]),M=dbGet('matches',[]);
  var clubs={};
  P.forEach(function(p){if(!p.club)return;if(!clubs[p.club])clubs[p.club]={nome:p.club,n:0,monitorati:0,cat:''};clubs[p.club].n++;clubs[p.club].cat=p.cat||''});
  M.forEach(function(m){if(!clubs[m.home])clubs[m.home]={nome:m.home,n:0,monitorati:0};if(!clubs[m.away])clubs[m.away]={nome:m.away,n:0,monitorati:0}});
  var rows=Object.keys(clubs).sort().map(function(c){
    var c2=clubs[c],mon=P.filter(function(p){return p.club===c}).length;
    var next=M.filter(function(m){return (m.home===c||m.away===c)&&m.stato!=='Completata'})[0];
    return '<tr class="rowlink" data-go="#partite"><td><b>'+esc(c)+'</b></td><td class="nw">'+c2.n+'</td><td class="nw">'+mon+'</td><td>'+(next?fmtD(next.data)+' · '+esc(next.comp):'—')+'</td></tr>';
  });
  return pagehead('Club','Squadre','','I club monitorati dal reparto, con rosa osservata e prossime partite.')
  +'<div class="card">'+tbl('<th>Squadra</th><th>Giocatori in rosa osservati</th><th>In follow-up</th><th>Prossima partita</th>',rows)+'</div>';
}

/* ---------- ANALYTICS ---------- */
function vAnalytics(){
  var O=dbGet('observations',[]),R=dbGet('reports',[]),P=dbGet('players',[]),SL=dbGet('shortlist',[]);
  function perMonth(list){
    var m={};
    list.forEach(function(x){var k=x.data?x.data.slice(0,7):'—';m[k]=(m[k]||0)+1});
    return Object.keys(m).sort().slice(-6).map(function(k){return {k:k,v:m[k]}});
  }
  var obsM=perMonth(O),repM=perMonth(R);
  function bars(data,color){
    var max=Math.max.apply(null,data.map(function(d){return d.v}).concat([1]));
    return '<div class="hbar">'+data.map(function(d){
      return '<div class="hb"><b class="nw" style="font-size:12px">'+d.v+'</b><i style="height:'+(d.v/max*85)+'%;'+(color?'background:'+color:'')+'"></i><span>'+d.k.slice(5)+'/'+d.k.slice(2,4)+'</span></div>';
    }).join('')+'</div>';
  }
  var perRuolo={};P.forEach(function(p){perRuolo[p.ruolo]=(perRuolo[p.ruolo]||0)+1});
  var perScout={};O.forEach(function(o){var s=dbGet('scouts',[]).find(function(x){return x.id===o.scout});if(s)perScout[s.nome]=(perScout[s.nome]||0)+1});
  var perStato={};P.forEach(function(p){perStato[p.stato]=(perStato[p.stato]||0)+1});
  return pagehead('Numeri del reparto','Analytics','','Grafici operativi: quanto e dove sta lavorando il team.')
  +'<div class="kpi">'
  +'<div class="card"><b>'+O.length+'</b><span>Osservazioni</span></div>'
  +'<div class="card"><b>'+R.length+'</b><span>Report prodotti</span></div>'
  +'<div class="card"><b>'+R.filter(function(r){return r.stato==='Approvato'}).length+'</b><span>Report approvati</span></div>'
  +'<div class="card"><b>'+SL.length+'</b><span>In shortlist</span></div>'
  +'</div>'
  +'<div class="grid2">'
  +'<div class="card"><div class="hd"><h2>Osservazioni per mese</h2></div>'+bars(obsM)+'</div>'
  +'<div class="card"><div class="hd"><h2>Report per mese</h2></div>'+bars(repM,'var(--gold)')+'</div>'
  +'<div class="card"><div class="hd"><h2>Giocatori per ruolo</h2></div><div style="padding:12px 16px">'+Object.keys(perRuolo).map(function(k){
    return '<div class="barrow"><span>'+k+'</span><div class="bar"><i style="width:'+(perRuolo[k]/P.length*100)+'%"></i></div><b class="nw" style="font-size:13px">'+perRuolo[k]+'</b></div>';
  }).join('')+'</div></div>'
  +'<div class="card"><div class="hd"><h2>Osservazioni per scout</h2></div><div style="padding:12px 16px">'+Object.keys(perScout).map(function(k){
    return '<div class="barrow"><span style="width:130px">'+esc(k)+'</span><div class="bar"><i style="width:'+(perScout[k]/O.length*100)+'%;background:var(--gold)"></i></div><b class="nw" style="font-size:13px">'+perScout[k]+'</b></div>';
  }).join('')+'</div></div>'
  +'<div class="card" style="grid-column:1/-1"><div class="hd"><h2>Distribuzione per stato</h2></div><div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap">'
  +Object.keys(perStato).map(function(k){return '<span class="tag" style="font-size:12.5px;padding:6px 14px">'+esc(k)+': <b>'+perStato[k]+'</b></span>'}).join('')
  +'</div></div></div>';
}

/* ---------- CONFRONTO ---------- */
var cfSel=[];
function vConfronta(){
  var P=dbGet('players',[]);
  var sel=P.filter(function(p){return cfSel.indexOf(p.id)>-1}).slice(0,4);
  function avg(p){
    var O=dbGet('observations',[]).filter(function(o){return o.player===p.id&&o.sc});
    if(!O.length)return null;
    var t=0,n=0;['tecnica','tattica','fisico','mentalita'].forEach(function(k){O.forEach(function(o){if(o.sc[k]){t+=o.sc[k];n++}})});
    return n?{score:+(t/n).toFixed(1),n:O.length}:null;
  }
  var head='<div class="card"><div class="hd"><h2>Seleziona fino a 4 giocatori</h2><span class="sp"></span>'+(sel.length>=2?'<button class="btn sm ghost" id="cfClear">Azzera</button>':'')+'</div><div class="tbl-wrap">'
  +'<table class="cmpradio"><thead><tr><th></th><th>Giocatore</th><th>Ruolo</th><th>Club</th><th>Oss.</th><th>Score</th><th>Ultima osservazione</th></tr></thead><tbody>'
  +P.map(function(p){
    var a=avg(p);
    var O=dbGet('observations',[]).filter(function(o){return o.player===p.id}).sort(function(x,y){return x.data<y.data?1:-1})[0];
    return '<tr class="rowlink" data-cf="'+p.id+'"><td><input type="checkbox"'+(cfSel.indexOf(p.id)>-1?' checked':'')+' aria-label="Seleziona '+esc(p.cognome)+'"></td>'
    +'<td><b>'+esc(p.cognome)+' '+esc(p.nome)+'</b></td><td>'+esc(p.ruolo)+'</td><td>'+esc(p.club)+'</td>'
    +'<td class="nw">'+(a?a.n:0)+'</td><td>'+(a?'<span class="score-pill '+scoreClass(a.score)+'">'+a.score+'</span>':'<span class="tag">N.V.</span>')+'</td>'
    +'<td class="nw">'+(O?fmtD(O.data):'—')+'</td></tr>';
  }).join('')+'</tbody></table></div></div>';
  if(sel.length<2){
    return pagehead('Comparazione','Confronta giocatori','','Seleziona da 2 a 4 giocatori dalla tabella: radar e attributi affiancati, con numero di osservazioni per pesare i giudizi.')
    +head;
  }
  var radarSets=sel.map(function(p,i){
    var O=dbGet('observations',[]).filter(function(o){return o.player===p.id&&o.sc});
    var A={tecnica:0,tattica:0,fisico:0,mentalita:0};
    if(O.length){['tecnica','tattica','fisico','mentalita'].forEach(function(k){var s=0,n=0;O.forEach(function(o){if(o.sc[k]){s+=o.sc[k];n++}});if(n)A[k]=+(s/n).toFixed(1)})}
    return {p:p,A:A,color:['#1a5cb0','#c7920e','#2e7d43','#b3402f'][i]};
  });
  var rows=[['Club',function(p){return esc(p.club)}],['Ruolo',function(p){return esc(p.ruolo)+(p.sottoruolo?' · '+p.sottoruolo:'')}],
    ['Età',function(p){return age(p.nascita)}],['Piede',function(p){return esc(p.piede)}],['Altezza',function(p){return p.altezza?p.altezza+' m':'—'}],
    ['Stato',function(p){return esc(p.stato)}],['Potenziale',function(p){return p.potenziale?p.potenziale+'/10':'—'}],
    ['Osservazioni',function(p){var a=avg(p);return a?a.n:0}],
    ['Score complessivo',function(p){var a=avg(p);return a?'<span class="score-pill '+scoreClass(a.score)+'">'+a.score+'</span>':'<span class="tag">N.V.</span>'}],
    ['Tecnica',function(p){var A=radarSets.find(function(r){return r.p.id===p.id}).A;return A.tecnica||'N.V.'}],
    ['Tattica',function(p){var A=radarSets.find(function(r){return r.p.id===p.id}).A;return A.tattica||'N.V.'}],
    ['Fisico',function(p){var A=radarSets.find(function(r){return r.p.id===p.id}).A;return A.fisico||'N.V.'}],
    ['Mentalità',function(p){var A=radarSets.find(function(r){return r.p.id===p.id}).A;return A.mentalita||'N.V.'}]];
  return pagehead('Comparazione','Confronta '+sel.length+' giocatori','','Dati affiancati. Attenzione: score basati su poche osservazioni sono meno affidabili — confronta anche il numero di rilevazioni.')
  +head
  +'<div class="card" style="margin-top:14px"><div class="hd"><h2>Radar comparativo</h2></div><div class="radar-wrap">'+multiRadar(radarSets)+'</div></div>'
  +'<div class="card" style="margin-top:14px"><div class="tbl-wrap"><table><thead><tr><th>Attributo</th>'+sel.map(function(p){return '<th>'+esc(p.cognome)+'</th>'}).join('')+'</tr></thead><tbody>'
  +rows.map(function(r){return '<tr><td style="font-weight:700">'+r[0]+'</td>'+sel.map(function(p){return '<td>'+r[1](p)+'</td>'}).join('')+'</tr>'}).join('')
  +'</tbody></table></div></div>';
}
function multiRadar(sets){
  var axes=['tecnica','tattica','fisico','mentalita'];
  var labels=['Tecnica','Tattica','Fisico','Ment.'];
  var cx=140,cy=115,R=80;
  var rings=[0.25,0.5,0.75,1].map(function(f){
    var rp=axes.map(function(ax,i){var ang=-Math.PI/2+i*2*Math.PI/4;return (cx+R*f*Math.cos(ang)).toFixed(1)+','+(cy+R*f*Math.sin(ang)).toFixed(1)}).join(' ');
    return '<polygon points="'+rp+'" fill="none" stroke="var(--line)"/>';
  }).join('');
  var polys=sets.map(function(s){
    var pts=axes.map(function(ax,i){
      var ang=-Math.PI/2+i*2*Math.PI/4,r=R*(s.A[ax]||0)/10;
      return (cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1);
    }).join(' ');
    return '<polygon points="'+pts+'" fill="'+s.color+'22" stroke="'+s.color+'" stroke-width="2"/>';
  }).join('');
  var lbl=labels.map(function(l,i){
    var ang=-Math.PI/2+i*2*Math.PI/4;
    return '<text x="'+(cx+(R+18)*Math.cos(ang)).toFixed(1)+'" y="'+(cy+(R+18)*Math.sin(ang)).toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="600" fill="var(--muted)">'+l+'</text>';
  }).join('');
  var legend=sets.map(function(s){return '<span style="display:inline-flex;align-items:center;gap:6px;margin:0 10px;font-size:12.5px;font-weight:600"><i style="width:11px;height:11px;border-radius:3px;background:'+s.color+';display:inline-block"></i>'+esc(s.p.cognome)+'</span>'}).join('');
  return '<svg width="280" height="230" viewBox="0 0 280 230">'+rings+polys+lbl+'</svg><div style="text-align:center;padding-bottom:10px">'+legend+'</div>';
}

var calCur=new Date();
function vCalendario(){
  var M=dbGet('matches',[]),S=dbGet('scouts',[]);
  var y=calCur.getFullYear(),mo=calCur.getMonth();
  var first=new Date(y,mo,1),start=(first.getDay()+6)%7; /* lunedì=0 */
  var dim=new Date(y,mo+1,0).getDate();
  var monthNames=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var cells='';
  for(var i=0;i<start;i++)cells+='<div class="day out"></div>';
  var todayIso=new Date().toISOString().slice(0,10);
  for(var d=1;d<=dim;d++){
    var iso=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

    }).join('')+'</div>';

  var upcoming=M.filter(function(m){return m.data>=todayIso}).sort(function(a,b){return a.data<b.data?-1:1}).slice(0,5);
  return pagehead('Programmazione','Calendario','<div class="calnav"><button class="btn ghost sm" id="calPrev">←</button><b>'+monthNames[mo]+' '+y+'</b><button class="btn ghost sm" id="calNext">→</button></div>','Partite, scout assegnati e target: la vista mese del lavoro del reparto.')
  +'<div class="card" style="padding:12px"><div class="cal">'
  +['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(function(x){return '<div class="calh">'+x+'</div>'}).join('')
  +cells+'</div></div>'
  +'<div class="card" style="margin-top:14px"><div class="hd"><h2>Prossime in agenda</h2></div>'
  +tbl('<th>Data</th><th>Partita</th><th>Competizione</th><th>Scout</th><th>Target</th>',upcoming.map(function(m){
    return '<tr class="rowlink" data-go="#partite/'+m.id+'"><td class="nw">'+fmtD(m.data)+' '+m.ora+'</td><td><b>'+esc(m.home)+'</b> – '+esc(m.away)+'</td><td>'+esc(m.comp)+'</td><td>'+esc((S.find(function(s){return s.id===m.scout})||{}).nome||'—')+'</td><td><span class="tag blue">'+esc(m.target||'—')+'</span></td></tr>';

/* ---------- AI ASSISTANT ---------- */
function aiPlayerSummary(p){
  var O=dbGet('observations',[]).filter(function(o){return o.player===p.id});
  var R=dbGet('reports',[]).filter(function(r){return r.player===p.id});
  var SL=dbGet('shortlist',[]).find(function(s){return s.player===p.id});
  var sc=playerScore(p);
  var out=[];
  out.push('Seguito dal <b>'+fmtD(p.scoperta)+'</b>: '+O.length+' osservazioni, '+(R.length?R.length+' report':'nessun report')+'.');
  if(sc)out.push('Score complessivo <b>'+sc+'/10</b>, potenziale stimato <b>'+(p.potenziale||'—')+'</b>.');
  if(O.length>=2){
    var half=Math.ceil(O.length/2);
    var recent=O.slice(0,half),older=O.slice(half);
    function avgSc(list){var t=0,n=0;list.forEach(function(o){if(o.sc){['tecnica','tattica','fisico','mentalita'].forEach(function(k){if(o.sc[k]){t+=o.sc[k];n++}})}});return n?t/n:null}
    var rA=avgSc(recent),oA=avgSc(older);
    if(rA&&oA){
      var delta=+(rA-oA).toFixed(1);
      if(delta>0.3)out.push('Le osservazioni recenti mostrano un <b>miglioramento di '+delta+' punti</b>: progressione reale, non singola prestazione.');
      else if(delta<-0.3)out.push('Le osservazioni recenti sono <b>'+(delta*-1)+' punti sotto</b> il periodo precedente: da verificare se fase o trend.');
      else out.push('Rendimento <b>stabile</b> tra le osservazioni.');
    }
  }
  if(p.forza&&p.forza.length)out.push('Punti di forza ricorrenti: <b>'+esc(p.forza.join(', '))+'</b>.');
  if(p.debolezze&&p.debolezze.length)out.push('Aree da approfondire: <b>'+esc(p.debolezze.join(', '))+'</b>.');
  if(SL)out.push('In shortlist con stato <b>'+esc(SL.stato)+'</b> (priorità '+esc(SL.priorita)+').');
  return out.map(function(x){return '<li>'+x+'</li>'}).join('');
}
function aiAnswer(q){
  var P=dbGet('players',[]),SL=dbGet('shortlist',[]),O=dbGet('observations',[]),R=dbGet('reports',[]);
  q=q.toLowerCase();
  if(q.indexOf('shortlist')>-1){
    var inSL=SL.map(function(s){var p=P.find(function(x){return x.id===s.player});return p?p.cognome+' '+p.nome+' ('+s.stato+')':null}).filter(Boolean);
    return 'In shortlist ci sono <b>'+inSL.length+' giocatori</b>:<ul>'+inSL.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
  }
  if(q.indexOf('rivalutaz')>-1||q.indexOf('mese')>-1){
    var cut=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
    var recent=O.filter(function(o){return o.data>=cut});
    return 'Negli ultimi 30 giorni: <b>'+recent.length+' osservazioni</b> e '+R.filter(function(r){return r.data>=cut}).length+' report.<ul>'+recent.slice(0,4).map(function(o){var p=P.find(function(x){return x.id===o.player})||{};return '<li>'+esc(p.cognome||'—')+' — '+fmtD(o.data)+'</li>'}).join('')+'</ul>';
  }
  if(q.indexOf('mancin')>-1){
    var manc=P.filter(function(p){return p.piede==='Sinistro'});
    return 'Giocatori mancini nel database: <b>'+manc.length+'</b>.<ul>'+manc.map(function(p){return '<li>'+esc(p.cognome+' '+p.nome)+' — '+esc(p.ruolo)+', '+esc(p.club)+'</li>'}).join('')+'</ul>';
  }
  if(q.indexOf('u19')>-1||q.indexOf('under')>-1||q.indexOf('giovani')>-1){
    var giovani=P.filter(function(p){return age(p.nascita)<=19});
    return 'Under 19 nel database: <b>'+giovani.length+'</b>.<ul>'+giovani.map(function(p){return '<li>'+esc(p.cognome+' '+p.nome)+' ('+age(p.nascita)+' anni) — '+esc(p.ruolo)+', '+esc(p.club)+'</li>'}).join('')+'</ul>';
  }
  var hit=P.filter(function(p){return q.length>2&&(p.cognome+' '+p.nome).toLowerCase().indexOf(q)>-1})[0];
  if(hit)return '<ul>'+aiPlayerSummary(hit)+'</ul>';
  return 'Posso rispondere su: un cognome, "<b>shortlist</b>", "<b>rivalutazioni del mese</b>", "<b>mancini</b>", "<b>under 19</b>". I dati sono solo letti — nessuna inferenza sugli score (§21).';
}
function vAI(){
  var P=dbGet('players',[]);
  var best=P.filter(function(p){return playerScore(p)}).sort(function(a,b){return playerScore(b)-playerScore(a)}).slice(0,2);
  return '<div class="grid2">'
  +'<div class="card"><div class="hd"><h2>Sintesi giocatori chiave</h2></div>'
  +best.map(function(p){return '<div class="ai-panel"><h3>'+esc(p.cognome+' '+p.nome)+'</h3><ul class="ai-body">'+aiPlayerSummary(p)+'</ul><div class="ai-note">Generato dai dati degli scout — osservazioni e report originali restano la fonte. Nessun punteggio modificato.</div></div>'}).join('')
  +'</div>'
  +'<div class="card"><div class="hd"><h2>Chiedi ai dati</h2></div><div style="padding:14px 16px">'
  +'<div class="ai-q" style="margin-top:0"><input id="aiQ" placeholder="Es. under 19, rivalutazioni del mese…"><button class="btn sm" id="aiGo">Chiedi</button></div>'
  +'<div class="ai-panel" id="aiOut" style="margin-top:12px"><h3>Risposta</h3><div class="ai-body">Prova: “shortlist”, “rivalutazioni del mese”, “mancini”, “under 19”, o il cognome di un giocatore.</div></div>'
  +'<div style="margin-top:12px"><label class="fl">Domande rapide</label>'
  +['shortlist','rivalutazioni del mese','mancini','under 19'].map(function(x){return '<button class="btn ghost sm" data-aiq="'+x+'" style="margin:0 5px 5px 0">'+x+'</button>'}).join('')
  +'</div></div></div>'
  +'</div>';
}

  switch(n.view){

    case 'giocatori-new':html=vPlayerNew();break;

    case 'osservazioni':html=vOsservazioni();break;
    case 'osservazioni-new':html=vObsNew(n.id);break;
    case 'partite':html=vPartite(n.id);break;
    case 'partite-new':html=vMatchNew();break;
    case 'shortlist':html=vShortlist();break;
    case 'calendario':html=vCalendario();break;
    case 'confronta':html=vConfronta();break;
    case 'video':html=vVideo();break;
    case 'mercato':html=vMercato();break;
    case 'ai':html=vAI();break;
    case 'report':html=vReport(n.id);break;
    case 'report-new':html=vReportNew(n.id);break;
    case 'squadre':html=vSquadre();break;
    case 'team':html=vTeam();break;
    case 'analytics':html=vAnalytics();break;
    default:html=vDashboard();
  }
  main.innerHTML='<div class="view">'+html+'</div>';
  renderShell();
  /* bindings */
  document.body.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click',function(e){if(e.target.closest('[data-mv],[data-openob]'))return;go(el.getAttribute('data-go'))});
  });
  if(n.view==='giocatori')bindGiocatori();
  if(n.view==='giocatori-new')bindPlayerNew();
  if(n.view==='player')bindPlayer(n.id);
  if(n.view==='osservazioni')bindOsservazioni();
  if(n.view==='osservazioni-new')bindObsNew();
  if(n.view==='partite')bindPartite();
  if(n.view==='partite-new')bindMatchNew();
  if(n.view==='shortlist')bindShortlist();
  if(n.view==='calendario')bindCalendario();
  if(n.view==='confronta')bindConfronta();
  if(n.view==='video')bindVideo();
  if(n.view==='mercato')bindMercato();
  if(n.view==='ai')bindAI();
  if(n.view==='report'||(n.view==='report'&&n.id))bindReport(n.id);
  if(n.view==='report-new')bindReportNew();
  if(n.view==='team')bindTeam();
}
window.addEventListener('hashchange',rerender);

/* ================= SHELL EVENTS ================= */
document.getElementById('loginBtn').addEventListener('click',function(){
  var r=document.querySelector('#rolePick button.on').getAttribute('data-role');
  var names={admin:'Marco Lazzeri',head:'Gianni Draghi',scout:'Massimo Billi',viewer:'Ospite'};
  ME={nome:names[r],role:r,scoutId:r==='head'?2:r==='scout'?3:1};
  dbSet('me',ME);
  document.getElementById('loginView').hidden=true;
  document.getElementById('appShell').hidden=false;
  rerender();
});
document.querySelectorAll('#rolePick button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#rolePick button').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
  });
});
if(dbGet('me',null)&&dbGet('seeded')){
  ME=dbGet('me');
  document.getElementById('loginView').hidden=true;
  document.getElementById('appShell').hidden=false;
  rerender();
}else{document.getElementById('loginView').hidden=false}

document.getElementById('newBtn').addEventListener('click',function(e){
  e.stopPropagation();
  var m=document.getElementById('newMenu');
  m.hidden=!m.hidden;
  document.getElementById('notifPanel').hidden=true;
  if(!canEdit()){m.hidden=true;toast('Il tuo profilo è in sola lettura')}
});
document.getElementById('notifBtn').addEventListener('click',function(e){
  e.stopPropagation();
  var p=document.getElementById('notifPanel');
  p.hidden=!p.hidden;
  document.getElementById('newMenu').hidden=true;
  document.getElementById('notifDot').hidden=true;
});
document.addEventListener('click',function(e){
  if(!e.target.closest('#newBtn'))document.getElementById('newMenu').hidden=true;
  if(!e.target.closest('#notifBtn'))document.getElementById('notifPanel').hidden=true;
});
document.getElementById('burger').addEventListener('click',function(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').hidden=!document.getElementById('scrim').hidden;
});
document.getElementById('scrim').addEventListener('click',function(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').hidden=true;
});
document.querySelectorAll('.nav-item').forEach(function(a){
  a.addEventListener('click',function(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').hidden=true;
  });
});
bindSearch();
</script>
</body>
</html>
